<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowMate Pro Companion</title>
  <style>
    :root {
      --bg-primary: #0F172A;
      --card-bg: #1E293B;
      --accent-indigo: #6366F1;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --emerald: #10B981;
      --rose: #EF4444;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand img {
      border-radius: 6px;
    }

    .title {
      font-size: 15px;
      font-weight: 800;
      background: linear-gradient(135deg, #818CF8, #C084FC);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .status-online {
      background-color: rgba(16, 185, 129, 0.15);
      color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-offline {
      background-color: rgba(239, 68, 68, 0.15);
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0F172A;
      color: var(--text-main);
      font-size: 12px;
      box-sizing: border-box;
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--accent-indigo);
    }

    .preview-box {
      font-size: 11px;
      color: #34D399;
      font-weight: 700;
      margin-top: 4px;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .stat-item {
      flex: 1;
      background-color: #0F172A;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }

    .stat-val {
      font-size: 14px;
      font-weight: 800;
      color: #818CF8;
    }

    .stat-lbl {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .history-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .history-list {
      max-height: 100px;
      overflow-y: auto;
      font-size: 11px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #334155;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .orig {
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 140px;
    }

    .renamed {
      color: #34D399;
      font-weight: 600;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
    }

    /* Custom Switch Toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent-indigo);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icon48.png" width="22" height="22" alt="Logo">
      <span class="title">FlowMate Pro</span>
    </div>
    <div id="connectionBadge" class="status-badge status-offline">● Desktop Offline</div>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="projectSelect">Active Project Profile:</label>
      <select id="projectSelect">
        <option value="">Loading projects...</option>
      </select>
    </div>

    <div class="form-group">
      <label>Naming Template:</label>
      <input type="text" id="templateInput" readonly placeholder="{counter}">
      <div id="previewBox" class="preview-box">Preview: 001.mp4</div>
    </div>
  </div>

  <div class="card">
    <div class="stats-row">
      <div class="stat-item">
        <div id="counterVal" class="stat-val">001</div>
        <div class="stat-lbl">Next Counter</div>
      </div>
      <div class="stat-item">
        <div id="todayVal" class="stat-val">0</div>
        <div class="stat-lbl">Today</div>
      </div>
      <div class="stat-item">
        <div id="totalVal" class="stat-val">0</div>
        <div class="stat-lbl">Total</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="toggle-row">
      <span>Auto Rename Downloads</span>
      <label class="switch">
        <input type="checkbox" id="autoToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="history-title">Recent Extension Activity</div>
    <div id="historyList" class="history-list">
      <div style="color: #64748B; text-align: center; padding: 8px;">No recent download activity</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
