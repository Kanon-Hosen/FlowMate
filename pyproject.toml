[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clippilot"
version = "2.0.0"
description = "ClipPilot - Automated Video & File Pilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.5.0",
    "watchdog>=3.0.0"
]

[tool.pyright]
include = ["."]
extraPaths = [
    ".",
    ".venv/lib/python3.12/site-packages",
    "/home/kanon/.local/lib/python3.12/site-packages"
]
executionEnvironments = [
  { root = "." }
]
